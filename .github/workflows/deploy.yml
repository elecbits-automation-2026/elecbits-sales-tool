# ═══════════════════════════════════════════════════════════════════════════
# DEPLOY TO PRODUCTION, without depending on Vercel's GitHub integration.
#
# That integration stopped firing on 21 October 2026. Seven merges reached
# main and none of them were built: on the last commit Vercel reacted to,
# three GitHub Apps responded (vercel, supabase, claude); on every commit
# since, only two. It was not failing builds, it was not being asked for
# any.
#
# This removes the dependency. GitHub runs this workflow on a push to main
# and it calls Vercel's API with a token, so the webhook no longer sits in
# the path between a merge and a deployment. If the integration is repaired
# later both will fire and Vercel will simply build the same commit twice —
# harmless, and a reason to delete one of them rather than to delay fixing
# the other.
#
# It is also runnable by hand: Actions → Deploy to production → Run
# workflow. That is a deploy button for anybody with repo access, which is
# worth having on the day the dashboard is the thing that is not working.
#
# ── SETUP: three repository secrets ───────────────────────────────────────
# Settings → Secrets and variables → Actions → New repository secret
#
#   VERCEL_TOKEN       Vercel → Account Settings → Tokens → Create.
#                      Scope it to the team that owns the project.
#   VERCEL_ORG_ID      ┐ both are printed by `npx vercel link` into
#   VERCEL_PROJECT_ID  ┘ .vercel/project.json, and are also on the
#                        project's Settings → General page.
#
# Nothing else moves. Every one of the thirty environment variables stays
# where it is — `vercel pull` fetches them at build time, so this does not
# become a second place to keep them in step.
# ═══════════════════════════════════════════════════════════════════════════

name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:        # the manual button

# A merge train must not race itself onto production. Newer wins; the older
# run is cancelled rather than left to land after it.
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      # 22, not 20. test:scope runs node --experimental-strip-types so it can
      # import lib/scope.ts directly, and that flag only exists from 22.6 —
      # on 20 node exits 9 with "bad option" before a single assertion runs.
      # The first run of this workflow died exactly there, which is a poor
      # way to find out the repo never declared the Node it needs. It does
      # now, in package.json engines, so the next person gets told by npm
      # rather than by a red deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The same gate used before every merge, run again here against the
      # commit that is actually about to ship. A deploy is the wrong moment
      # to discover the suite was red.
      - run: npm ci
      - run: npm run build
      - run: npm run test:scope
      - run: npm run test:brain
      - run: npm run test:digest
      - run: npm run test:rfq

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      # VERCEL BUILDS THIS, NOT US — and the first version of this workflow
      # got that wrong in a way that took production down.
      #
      # It ran `vercel pull` then `vercel build --prod`, building here and
      # uploading the output. But Vercel cannot hand back an environment
      # variable marked SENSITIVE: `pull` writes the literal text
      # [SENSITIVE] in place of the value. VITE_SUPABASE_URL is marked that
      # way, Vite inlines VITE_* into the browser bundle at build time, and
      # the deployed app came up with supabaseUrl === "https://[SENSITIVE]":
      # every page dead on "Invalid supabaseUrl: Provided URL is malformed".
      #
      # Deploying the SOURCE instead puts the build back on Vercel, where
      # the real values live and where it has always happened. There is no
      # copy of the environment here to redact, go stale, or leak into a
      # log. The build cannot be reached by this failure at all.
      #
      # `npm run build` above still runs, so a build that cannot compile is
      # caught here before Vercel is asked to do it for real.
      - name: Deploy
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
