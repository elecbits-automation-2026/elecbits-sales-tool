<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Default: light.
      try {
        var t = localStorage.getItem("sales:theme");
        if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    </script>
    <!-- Elecbits circuit mark, brand blue so it reads on light and dark tab bars -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0070ff" />
    <title>Elecbits · Sales OS</title>
    <meta
      name="description"
      content="Elecbits Sales OS — lead → PO pipeline with AI stage gates, KPIs, training and expense approvals. Nothing missed."
    />
    <!-- Link previews (Slack, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elecbits" />
    <meta property="og:title" content="Elecbits · Sales OS" />
    <meta
      property="og:description"
      content="Lead → PO pipeline with AI stage gates, KPIs, training and expense approvals. Nothing missed."
    />
    <!-- Absolute URL: link-preview crawlers do not reliably resolve relative ones -->
    <meta property="og:url" content="https://elecbits-sales-tool.vercel.app/" />
    <meta property="og:image" content="https://elecbits-sales-tool.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
